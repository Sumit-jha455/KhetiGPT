<!-- KhetiGPT logo mark: dark green rounded square with a sprout (used by the Logo component) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded square background in the secondary dark green -->
  <rect width="64" height="64" rx="16" fill="#175332" />
  <!-- Vertical stem of the sprout -->
  <path d="M32 50V30" stroke="#dcfce7" stroke-width="5" stroke-linecap="round" />
  <!-- Left leaf -->
  <path d="M32 34c-10 0-14-6-14-12 8 0 14 4 14 12z" fill="#8fd8a2" />
  <!-- Right leaf -->
  <path d="M32 28c0-8 6-13 14-13 0 8-5 13-14 13z" fill="#57bd78" />
  <!-- Soil line beneath the stem -->
  <path d="M20 54h24" stroke="#bfe9c8" stroke-width="4" stroke-linecap="round" />
</svg>
